# Configuração do Supabase CLI (supabase start / supabase functions deploy).
project_id = "balcao"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

# Funções chamadas por provedores externos ou pelo pg_cron: validam a origem
# pelo próprio segredo, então não exigem o JWT do Supabase.
[functions.meta-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.billing-webhook]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.api]
verify_jwt = false
